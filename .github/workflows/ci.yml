name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=90s ./...
      - run: go test ./codec -run='^$' -fuzz=FuzzRawFrame -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzDecode -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzEncodeSM -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzSubmitMulti -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzStandardTLVSection -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzSemanticTimes -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzDataDirection -fuzztime=5s -parallel=2
      - run: go test ./codec -run='^$' -fuzz=FuzzDataResponse -fuzztime=5s -parallel=2
      - run: go test ./message -run='^$' -fuzz=FuzzUDH -fuzztime=5s -parallel=2
      - run: go test ./message -run='^$' -fuzz=FuzzAdditionalUDH -fuzztime=5s -parallel=2
      - run: go test ./message -run='^$' -fuzz=FuzzNationalLanguageProtection -fuzztime=5s -parallel=2
      - run: go test ./message -run='^$' -fuzz=FuzzReceipt -fuzztime=5s -parallel=2
      - run: go test ./message -run='^$' -fuzz=FuzzPrepareVersionEncoding -fuzztime=5s -parallel=2
      - run: go test ./textcodec -run='^$' -fuzz=FuzzCharsets -fuzztime=5s -parallel=2
