name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.go }})
    timeout-minutes: 45
    strategy:
      # Keep evidence from both compilers if either job fails.
      fail-fast: false
      matrix:
        include:
          # Go 1.26 has the time-budget cancellation race golang/go#75804.
          # Native execution budgets avoid that path without filtering failures.
          - go: '1.26.x'
            fuzz_budget: '1000000x'
          - go: '1.27.x'
            fuzz_budget: '5s'
    runs-on: ubuntu-latest
    env:
      FUZZ_BUDGET: ${{ matrix.fuzz_budget }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=90s ./...
      # Go's -timeout bounds the pre-fuzz test phase, not active fuzzing.
      # Actions step timeouts enforce the wall-clock cap on fuzz workers.
      - run: go test ./codec -run='^$' -fuzz=FuzzRawFrame -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzDecode -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzEncodeSM -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzSubmitMulti -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzStandardTLVSection -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzSemanticTimes -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzDataDirection -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./codec -run='^$' -fuzz=FuzzDataResponse -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./message -run='^$' -fuzz=FuzzUDH -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./message -run='^$' -fuzz=FuzzAdditionalUDH -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./message -run='^$' -fuzz=FuzzNationalLanguageProtection -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./message -run='^$' -fuzz=FuzzReceipt -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./message -run='^$' -fuzz=FuzzPrepareVersionEncoding -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      - run: go test ./textcodec -run='^$' -fuzz=FuzzCharsets -fuzztime="$FUZZ_BUDGET" -parallel=2 -timeout=9m
        timeout-minutes: 10
      # The deadline race can obscure a crash report. Keep any written corpus
      # even when no "Failing input written to" line appeared in the job log.
      - name: Preserve failing fuzz inputs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.go }}-${{ github.run_attempt }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: warn
          retention-days: 30
